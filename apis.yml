aid: vsco
name: VSCO
x-enrichment:
  date: '2026-07-21'
  status: enriched
  artifacts_added: 18
  pass: local-v1
description: >-
  VSCO is a photography company whose mobile apps and community give photographers
  editing tools, presets, and a place to share their work. Its business product, VSCO
  Workspace (the former Tave studio-management platform), ships a public REST API — the
  VSCO Workspace API v2 — that exposes a studio's contacts, jobs, orders, quotes,
  payments, events, galleries, files, and REST Hook webhook subscriptions behind API-key
  authentication, with a published OpenAPI 3.0 definition and Redoc reference.
url: https://raw.githubusercontent.com/api-evangelist/vsco/refs/heads/main/apis.yml
