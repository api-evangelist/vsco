- aid: vsco:vsco-rest-hooks-api
  name: VSCO Rest Hooks API
  description: >-
    Webhooks based on <a href="https://zapier.com/engineering/introducing-resthooksorg/" target="_blank">Zapier's
    now-deprecated REST Hooks specification</a>.<br> <br> You can use these to receive a postback to a
    custom URL when certain events happen in VSCO Workspace.<br> <br> Much like an Automation Web Request
    Action, these webhooks will trigger when the event occurs. However, for security reasons, only the
    <code>targetId</code> will be provided, which you'll then use to fetch the current version of the
    entity via the API.
  humanURL: https://workspace.vsco.co/api
